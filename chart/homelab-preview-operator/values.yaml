# Default values for homelab-preview-operator

replicaCount: 1

image:
  repository: ghcr.io/fredericrous/homelab-preview-operator
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Operator configuration
config:
  # Domain for preview URLs (e.g., pr-7-myapp.preview.example.com)
  previewDomain: "example.com"
  # Log level (debug, info, warn, error)
  logLevel: info
  # Enable leader election (for HA deployments)
  leaderElect: false
  # Repository (owner/repo) for posting PR comments
  githubRepo: ""
  # Forge API flavour for PR comments: github or gitea.
  # Forgejo speaks the Gitea API, so self-hosted Forgejo uses "gitea".
  gitProvider: github
  # Forge API base URL. Empty means https://api.github.com for github, and for
  # gitea the host of the Flux GitRepository the preview syncs from.
  gitApiBaseUrl: ""
  # Image the PreviewCheck http probe Job runs inside the preview namespace.
  # It only needs curl and a POSIX shell.
  probeImage: "curlimages/curl:8.11.1"
  # KEV/EPSS enrichment endpoint (cluster-vision POST /api/cve/enrichment).
  # Empty makes the PreviewCheck trivy check FAIL CLOSED: it reports
  # EnrichmentUnavailable rather than reading an unenriched scan as clean.
  cveEnrichmentUrl: ""

# Metrics configuration
metrics:
  enabled: true
  port: 8080
  # Service exposing the metrics port. Required by the ServiceMonitor below;
  # before 0.9.0 the chart shipped neither and nothing scraped the operator.
  service:
    enabled: true
    type: ClusterIP
    annotations: {}
  serviceMonitor:
    # On by default: an operator nobody scrapes publishes its verdicts into the
    # void. Turn it off on a cluster without the Prometheus operator CRDs.
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels for the Prometheus instance's serviceMonitorSelector.
    labels: {}
    relabelings: []
    metricRelabelings: []

# Health probes configuration
health:
  port: 8081
