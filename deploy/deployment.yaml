apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-operator
  namespace: preview-system
  labels:
    app.kubernetes.io/name: preview-operator
    app.kubernetes.io/component: manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-operator
      annotations:
        # Exclude from Istio mesh - operator doesn't need it
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: preview-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/fredericrous/homelab-preview-operator:latest
          imagePullPolicy: Always
          args:
            - --leader-elect
            - --preview-domain=daddyshome.fr
            - --github-repo=fredericrous/homelab
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
