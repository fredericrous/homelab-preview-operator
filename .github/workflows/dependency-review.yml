name: License Check

# The dependency-review-action was dropped: it requires GitHub's Dependency
# graph, which on a private repo also opens the door to Dependabot raising PRs
# on its own. Without the graph the action hard-fails ("Dependency review is not
# supported on this repository"), so it was a permanently red gate on any go.mod
# change. Its two checks are already covered: govulncheck (pr.yml) scans for
# vulnerabilities, and go-licenses below enforces licensing.

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/dependency-review.yml'

permissions:
  contents: read

jobs:
  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Check licenses
        run: |
          go-licenses check ./... --disallowed_types=forbidden,restricted
